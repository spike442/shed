[project]
name = "shed-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "shed-core",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-openai>=1.7,<2",
  "pydantic>=2.10,<3",
]

[tool.uv.sources]
shed-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["shed.agents*"]
