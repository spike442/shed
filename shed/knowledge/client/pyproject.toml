[project]
name = "knowledge-client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "shed-core",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[tool.uv.sources]
shed-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["knowledge.client*"]
