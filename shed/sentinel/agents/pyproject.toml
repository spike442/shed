[project]
name = "sentinel-agents"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
  "shed-agents",
  "shed-core",
  "knowledge-client",
  "sentinel-core",
  "httpx>=0.28,<1",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "pydantic>=2.10,<3",
]

[tool.uv.sources]
shed-agents = { workspace = true }
shed-core = { workspace = true }
knowledge-client = { workspace = true }
sentinel-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["sentinel.agents*"]
