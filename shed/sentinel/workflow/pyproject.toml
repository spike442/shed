[project]
name = "sentinel-workflow"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
  "shed-core",
  "sentinel-core[knowledge-client,kafka,database,metrics,github]",
]

[tool.uv.sources]
shed-core = { workspace = true }
sentinel-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["sentinel.workflow*"]
