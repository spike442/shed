[project]
name = "sentinel-executor"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
  "shed-core",
  "sentinel-core[kafka,github]",
  "httpx>=0.28,<1",
]

[tool.uv.sources]
shed-core = { workspace = true }
sentinel-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["sentinel.executor*"]
