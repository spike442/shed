[project]
name = "shed-api"
version = "0.1.2"
requires-python = ">=3.12"
dependencies = [
  "sentinel-core[database,kafka,metrics]",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["shed.api*"]
