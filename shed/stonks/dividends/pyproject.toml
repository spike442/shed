[project]
name = "stonks-dividends"
version = "0.1.2"
requires-python = ">=3.12"
dependencies = [
  "shed-agents",
  "shed-core",
  "stonks-core",
  "exchange-calendars>=4.13,<5",
  "httpx>=0.28,<1",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings[yaml]>=2.7,<3",
  "pypdf>=5,<7",
  "tzdata>=2025.2",
]

[tool.uv.sources]
shed-agents = { workspace = true }
shed-core = { workspace = true }
stonks-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["stonks.dividends*"]
