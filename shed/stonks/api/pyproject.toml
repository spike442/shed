[project]
name = "stonks-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "stonks-core",
  "fastapi>=0.115,<1",
  "pyarrow>=21,<25",
  "pydantic>=2.10,<3",
  "pydantic-settings[yaml]>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
stonks-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["stonks.api*"]
