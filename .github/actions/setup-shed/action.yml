name: Set up Shed
description: Install Python, uv, Helm for the chart-rendered test config, and the locked Shed workspace with dev tools
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.12.20"
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: shed/uv.lock
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.1
    - name: Install workspace
      shell: bash
      working-directory: shed
      run: |
        uv sync --locked --all-packages --group dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Render chart config
      shell: bash
      run: |
        render() {
          local chart=$1 variable=$2
          local directory="$RUNNER_TEMP/$chart-config"
          mkdir -p "$directory"
          helm template "$chart" "infra/$chart/chart" --namespace agents --show-only templates/config.yaml \
            | yq ea -N '.data | to_entries | .[] | .key + "\t" + (.value | @base64)' \
            | while IFS=$'\t' read -r name content; do base64 -d <<< "$content" > "$directory/$name"; done
          echo "$variable=$directory" >> "$GITHUB_ENV"
        }
        render sentinel SENTINEL_CONFIG_DIR
        render shed SHED_CONFIG_DIR
