version: '3'

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Install the Shed workspace and the Shed UI dependencies
    cmds:
      - cd shed && uv sync --locked --all-packages --group dev
      - npm --prefix shed/shed/ui ci
      - pre-commit install

  lint:
    desc: Run the pre-commit secret scan, lint, and format hooks on every file
    cmds:
      - pre-commit run --all-files

  ui:
    desc: Serve the UI
    dir: shed/shed/ui
    vars:
      CONSOLE_API_URL: '{{.CONSOLE_API_URL | default "https://shed.timcasa.me/api"}}'
    env:
      CONSOLE_API_URL: '{{.CONSOLE_API_URL}}'
    cmds:
      - npm run dev

  ansible:init:
    desc: Install the Ansible deps
    dir: infra/ansible
    cmds:
      - ansible-galaxy collection install -r requirements.yaml

  sql:
    desc: Apply a module's SQL of the highest version from scratch (knowledge before a domain's clickhouse)
    cmds:
      - task: module-playbook
        vars: {KIND: sql, MODULE: '{{.MODULE}}', CLI_ARGS: '{{.CLI_ARGS}}'}

  s3:
    desc: Create a module's buckets and upload its context and reference documents
    cmds:
      - task: module-playbook
        vars: {KIND: s3, MODULE: '{{.MODULE}}', CLI_ARGS: '{{.CLI_ARGS}}'}

  module-playbook:
    internal: true
    silent: true
    dir: infra/ansible
    env:
      ANSIBLE_CONFIG: ansible.cfg
    cmds:
      - |-
        module="{{.MODULE}}"
        if [ -z "$module" ]; then
          module="$(ansible-inventory --graph {{.KIND}} | sed -n 's/.*--\([a-z]*\)-.*/\1/p' | sort -u | gum choose --header 'Select module')"
        fi
        ansible-playbook {{.KIND}}.yaml --extra-vars "module=$module" -v {{.CLI_ARGS}}

  rollout:
    desc: Reconcile the Shed, knowledge, Sentinel, and Stonks Flux Kustomizations
    vars:
      NAMESPACE: '{{.NAMESPACE | default "agents"}}'
    cmds:
      - for: [shed, knowledge, sentinel, stonks]
        cmd: flux reconcile kustomization {{.ITEM}} --namespace '{{.NAMESPACE}}' --with-source
