version: '3'

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Install the Shed workspace and the Shed UI dependencies
    cmds:
      - cd shed && uv sync --locked --all-packages --group dev
      - npm --prefix shed/shed/ui ci
      - pre-commit install

  lint:
    desc: Run the pre-commit secret scan, lint, and format hooks on every file
    cmds:
      - pre-commit run --all-files

  ui:
    desc: Serve the UI
    dir: shed/shed/ui
    vars:
      CONSOLE_API_URL: '{{.CONSOLE_API_URL | default "https://sentinel.timcasa.me/api"}}'
    env:
      CONSOLE_API_URL: '{{.CONSOLE_API_URL}}'
    cmds:
      - npm run dev

  ansible:init:
    desc: Install the Ansible deps
    dir: infra/ansible
    cmds:
      - ansible-galaxy collection install -r requirements.yaml

  artifacts:
    desc: Deploy one fresh-install component of a module, asking for the module and then its component
    silent: true
    dir: infra/ansible
    env:
      ANSIBLE_CONFIG: ansible.cfg
    cmds:
      - |-
        module="{{.MODULE}}"
        if [ -z "$module" ]; then
          module="$(gum choose --header 'Select module' knowledge sentinel stonks)"
        fi
        case "$module" in
          knowledge) components="clickhouse" ;;
          sentinel) components="all clickhouse postgresql s3" ;;
          stonks) components="s3 logs" ;;
          *) echo "Unsupported module: $module" >&2; exit 1 ;;
        esac
        component="{{.COMPONENT}}"
        if [ -z "$component" ]; then
          component="$(gum choose --header "Select $module component" $components)"
        fi
        case " $components " in
          *" $component "*) ;;
          *) echo "Unsupported $module component: $component (choose from: $components)" >&2; exit 1 ;;
        esac
        case "$module/$component" in
          knowledge/clickhouse) hosts="clickhouse" ;;
          sentinel/all) hosts="clickhouse,postgresql,s3" ;;
          sentinel/*) hosts="$component" ;;
          stonks/s3) hosts="stonks-s3" ;;
          stonks/logs) hosts="stonks-logs" ;;
        esac
        ansible-playbook deploy.yaml --limit "$hosts" --extra-vars "sql_module=$module" -v {{.CLI_ARGS}}

  rollout:
    desc: Reconcile the Shed, knowledge, Sentinel, and Stonks Flux Kustomizations
    vars:
      NAMESPACE: '{{.NAMESPACE | default "agents"}}'
    cmds:
      - for: [shed, knowledge, sentinel, stonks]
        cmd: flux reconcile kustomization {{.ITEM}} --namespace '{{.NAMESPACE}}' --with-source
