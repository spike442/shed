{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: knowledge
{{ include "knowledge.standardLabels" . | indent 4 }}
  name: knowledge
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: knowledge
  policyTypes: [Ingress]
  ingress:
  - from:
{{- range .Values.networkPolicy.clients }}
    - podSelector:
        matchLabels:
{{ toYaml . | indent 10 }}
{{- end }}
    ports:
    - port: 9092
      protocol: TCP
{{- end }}
