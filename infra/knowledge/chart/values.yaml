image:
  repository: ghcr.io/spike442/shed/knowledge
  tag: ""

secret: knowledge-secrets

domainSecrets:
  sentinel: sentinel-secrets

clickhouse:
  host: clickhouse.database.svc.cluster.local
  database: knowledge
  user: knowledge

s3:
  endpoint: http://rustfs-svc.storage.svc.cluster.local:9000
  region: us-east-1

networkPolicy:
  enabled: true
  clients:
    - app.kubernetes.io/name: sentinel
      app.kubernetes.io/role: workflow
    - app.kubernetes.io/name: sre
