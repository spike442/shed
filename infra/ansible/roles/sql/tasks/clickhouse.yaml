---
- name: Initialize ClickHouse
  when: sql_paths | length > 0
  block:
    - name: Set the ClickHouse client command
      ansible.builtin.set_fact:
        sql_clickhouse_client_command: /usr/local/bin/clickhouse

    - name: Read the ClickHouse SQL files, rendering templates
      ansible.builtin.set_fact:
        sql_clickhouse_content: >-
          {{ sql_clickhouse_content | default('') ~
          (lookup('template', item) if item.endswith('.j2') else lookup('file', item)) ~ '\n' }}
      loop: "{{ sql_paths }}"

    - name: Run the ClickHouse SQL
      ansible.builtin.command:
        argv:
          - "{{ sql_clickhouse_client_command }}"
          - client
          - "--host={{ db_host }}"
          - "--port={{ db_port }}"
          - "--user={{ db_user }}"
          - "--database={{ db_database }}"
        stdin: "{{ sql_clickhouse_content }}"
      environment:
        CLICKHOUSE_PASSWORD: "{{ db_password }}"
      changed_when: true
