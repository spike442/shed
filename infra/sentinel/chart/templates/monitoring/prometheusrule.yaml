{{- if .Values.agents.sre.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: sentinel
{{ include "sentinel.standardLabels" . | indent 4 }}
  name: sentinel-rules
  namespace: {{ .Release.Namespace }}
spec:
  groups:
  - name: sentinel.rules
    rules:
    - alert: SentinelClusterAlertProcessingFailing
      expr: sum(rate(sentinel_cluster_alert_events_total{namespace="{{ .Release.Namespace }}",result!="ok"}[15m])) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Sentinel is failing to process cluster alerts
        description: The workflow is failing Alertmanager cluster alert events; check its logs and consumer lag.
{{- end }}
