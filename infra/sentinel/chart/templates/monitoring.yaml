{{- if .Values.agents.sre.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
{{ include "sentinel.metadata" (dict "root" . "name" "sentinel-workflow") }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: sentinel-workflow}
  podMetricsEndpoints:
  - {port: metrics, interval: 60s}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
{{ include "sentinel.metadata" (dict "root" . "name" "sentinel-rules" "component" "sentinel-workflow") }}
spec:
  groups:
  - name: sentinel.rules
    rules:
    - alert: SentinelClusterAlertProcessingFailing
      expr: sum(rate(sentinel_cluster_alert_events_total{namespace="{{ .Release.Namespace }}",result!="ok"}[15m])) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Sentinel is failing to process cluster alerts
        description: The workflow is failing Alertmanager cluster alert events; check its logs and consumer lag.
{{- end }}
