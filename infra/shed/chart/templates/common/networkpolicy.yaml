{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: shed
{{ include "shed.standardLabels" . | indent 4 }}
  name: shed
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shed
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.route.gatewayNamespace }}
    ports:
    - {port: 8070, protocol: TCP}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alertmanager
    ports:
    - {port: 8070, protocol: TCP}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
    ports:
    - {port: 9100, protocol: TCP}
{{- end }}
