apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/name: shed
{{ include "shed.standardLabels" . | indent 4 }}
  name: shed
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
  - {{ .Values.route.hostname | quote }}
  parentRefs:
  - name: {{ .Values.route.gatewayName }}
    namespace: {{ .Values.route.gatewayNamespace }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: shed
      port: 8070
